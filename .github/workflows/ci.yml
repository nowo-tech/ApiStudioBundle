# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.1; real databases (MySQL, MariaDB, PostgreSQL; DBAL 3 and 4); static analysis (PHPStan, Rector, Igor); coverage on PHP 8.4 + Symfony 7.4.
# Release (incl. latest) is created by release.yml on tag push (v*).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          # Symfony 8 requires PHP >= 8.4
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, soap, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      # Spec 003 (audit RW-L1): the bundled script runner's integration tests run under Deno, its default command.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          composer require --no-interaction --no-update \
            symfony/asset:^${{ matrix.symfony }} \
            symfony/config:^${{ matrix.symfony }} \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/form:^${{ matrix.symfony }} \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            symfony/http-client:^${{ matrix.symfony }} \
            symfony/http-kernel:^${{ matrix.symfony }} \
            symfony/mime:^${{ matrix.symfony }} \
            symfony/routing:^${{ matrix.symfony }} \
            symfony/security-bundle:^${{ matrix.symfony }} \
            symfony/security-csrf:^${{ matrix.symfony }} \
            symfony/translation:^${{ matrix.symfony }} \
            symfony/twig-bundle:^${{ matrix.symfony }} \
            symfony/validator:^${{ matrix.symfony }} \
            symfony/yaml:^${{ matrix.symfony }}
          # keep browser-kit in require-dev (do not move it to require)
          composer require --dev --no-interaction --no-update \
            symfony/browser-kit:^${{ matrix.symfony }} \
            symfony/process:^${{ matrix.symfony }}
          # full -W update so doctrine/* can move to ^3 on Symfony 8
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test

      - name: Run tests with coverage (PHP 8.4 + Symfony 7.4 only)
        if: matrix.php == '8.4' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test-coverage

      - name: Coverage gate (REQ-TEST-003, PHP lines >= 99%)
        if: matrix.php == '8.4' && matrix.symfony == '7.4'
        run: composer coverage-check

  databases:
    # 1.17 REQ-RUNTIME-003: two-connection races of the seed API / scope mover on real servers (required check).
    name: Databases (MySQL 8.4, MariaDB 11.4, PostgreSQL 16) - ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: 'DBAL 4'
            dbal: '^4.0'
          - deps: 'DBAL 3'
            dbal: '^3.8.2'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: api_studio
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: api_studio
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: api_studio
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, soap, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Pin the DBAL major
        run: composer require "doctrine/dbal:${{ matrix.dbal }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Real race / lock wait tests (none may be skipped)
        env:
          AS_MYSQL_URL: mysql://root@127.0.0.1:3306/api_studio?serverVersion=8.4.0
          AS_MARIADB_URL: mysql://root@127.0.0.1:3307/api_studio?serverVersion=11.4.2-MariaDB
          AS_POSTGRES_URL: pgsql://postgres@127.0.0.1:5432/api_studio?serverVersion=16
        run: vendor/bin/phpunit --testsuite Database --no-coverage --fail-on-skipped

  static-analysis:
    name: Static analysis (PHPStan, Rector, Igor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, soap, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # REQ-CS-006: PHPStan errors fail the build (ignoreErrors: [], no baseline).
      - name: PHPStan
        run: composer phpstan

      - name: Rector (dry run)
        run: composer rector-dry

      # REQ-CS-008: FrankenPHP worker-state audit.
      - name: Igor
        run: composer igor

  assets:
    name: TypeScript (typecheck, Vitest, committed build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Vitest with coverage thresholds (REQ-TEST-003)
        run: pnpm run test:coverage

      - name: Committed assets match a rebuild
        run: |
          pnpm run build
          git diff --exit-code -- src/Resources/public

  cs-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check
