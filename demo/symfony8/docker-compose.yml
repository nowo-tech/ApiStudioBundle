name: api-studio-bundle-demo-symfony-8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-studio-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8023}:80"
    volumes:
      - .:/app
      - ../..:/var/api-studio-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_MEMORY_LIMIT: "-1"
      COMPOSER_MAX_PARALLEL_HTTP: "4"
      APP_ENV: dev
      FRANKENPHP_MODE: ${FRANKENPHP_MODE:-worker}
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-demo-secret}
      # Override .env localhost URL — use internal Docker network host `database`.
      DATABASE_URL: mysql://app:app@database:3306/app?serverVersion=8.4&charset=utf8mb4
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
    mem_limit: 2g
    networks:
      - api-studio-demo-network
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - api-studio-demo-network

volumes:
  database_data:
  composer-cache:

networks:
  api-studio-demo-network:
    driver: bridge
