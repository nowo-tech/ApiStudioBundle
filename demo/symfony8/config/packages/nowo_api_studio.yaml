nowo_api_studio:
    enabled: true
    ui:
        path: '/api-studio'
        default_locale: en
        locales: [en, es]
        # layout_template: null (default) = nowo_ui_kit.layouts.admin (config/packages/nowo_ui_kit.yaml).
        # Demo-only: empty roles + allow_unauthenticated (never use in production).
        required_roles: []
    security:
        access_roles: []
        allow_unauthenticated: true
