nowo_api_studio:
    enabled: true
    ui:
        path: '/api-studio'
        default_locale: en
        locales: [en, es]
        # 1.23: create actions in the UiKit page-actions menu (default `header` = buttons in the header row).
        header_actions: page_actions
        # layout_template: null (default) = nowo_ui_kit.layouts.admin (config/packages/nowo_ui_kit.yaml).
        # Demo-only: empty roles + allow_unauthenticated (never use in production).
        required_roles: []
    # 1.14: nested folders (the demo schema is created by nowo:api-studio:sync-schema).
    folders:
        enabled: true
    security:
        access_roles: []
        allow_unauthenticated: true
