# REQ-DEMO-014 / REQ-UI-003: UiKit's default theme, unchanged, with UiKit's own semantic stylesheet only (no CSS
# framework, no CDN). Every API Studio page renders in the demo shell (base.html.twig extends UiKit's admin layout).
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    layouts:
        admin: 'base.html.twig'
