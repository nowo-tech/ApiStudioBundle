# REQ-DEMO-014 / REQ-UI-003: UiKit's default theme, unchanged (no CSS framework, no CDN). The demo shell
# (templates/base.html.twig, UiKit's demo platform layout) is the admin and guest layout of every API Studio page.
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: none
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
