services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nowo\ApiStudioBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Model/'
            - '../../EventSubscriber/'
            - '../../Form/'
            - '../../Soap/'
            - '../../ApiStudioBundle.php'
            - '../../Controller/'

    # Controllers carry #[Route] attributes: autoconfigure stays off so Symfony >= 7.3 does not tag them
    # routing.controller (the host's `routing.controllers` resource would then load every Api Studio route without
    # importing routes.yaml, bypassing its prefix and when@ guards). Routes are opt-in through routes.yaml only.
    Nowo\ApiStudioBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\ApiStudioBundle\Repository\:
        resource: '../../Repository/'

    Nowo\ApiStudioBundle\Command\:
        resource: '../../Command/'
        tags: ['console.command']

    Nowo\ApiStudioBundle\Service\LocaleManager:
        arguments:
            $enabledLocales: '%nowo_api_studio.ui.locales%'
            $defaultLocale: '%nowo_api_studio.ui.default_locale%'

    Nowo\ApiStudioBundle\Service\WorkspaceEnvironmentInitializer:
        arguments:
            $defaultEnvironmentNames: '%nowo_api_studio.environments%'

    Nowo\ApiStudioBundle\Service\RequestExecutor:
        arguments:
            $timeoutSeconds: '%nowo_api_studio.ui.request_timeout_seconds%'
            $maxRedirects: '%nowo_api_studio.execution_max_redirects%'
            $maxResponseBytes: '%nowo_api_studio.execution_max_response_bytes%'

    Nowo\ApiStudioBundle\Controller\DashboardController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $listPageSize: '%nowo_api_studio.ui.list_page_size%'

    Nowo\ApiStudioBundle\Controller\ApiWorkspaceController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $listPageSize: '%nowo_api_studio.ui.list_page_size%'

    Nowo\ApiStudioBundle\Twig\ApiStudioExtension:
        arguments:
            $layoutTemplate: '%nowo_api_studio.ui.layout_template%'
            $cssFramework: '%nowo_api_studio.ui.css_framework%'

    # UiKit page contract (REQ-UI-003): layout resolution (null = nowo_ui_kit.layouts.admin) + view models.
    Nowo\ApiStudioBundle\Ui\ApiStudioPages:
        arguments:
            $layoutTemplate: '%nowo_api_studio.ui.layout_template%'
            $twig: '@twig'

    Nowo\ApiStudioBundle\Doctrine\TablePrefixSubscriber:
        arguments:
            $tablePrefix: '%nowo_api_studio.table_prefix%'

    Nowo\ApiStudioBundle\Security\SecretValueCipher:
        arguments:
            $encryptionKeyMaterial: '%nowo_api_studio.secrets.encryption_key_material%'

    Nowo\ApiStudioBundle\Doctrine\SecretVariableEncryptionListener:
        arguments:
            $cipher: '@Nowo\ApiStudioBundle\Security\SecretValueCipher'
            $enabled: '%nowo_api_studio.secrets.encrypt%'

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\ApiStudioBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']
