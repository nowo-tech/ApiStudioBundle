services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # 1.12 (rule 6): the manager of the Api Studio entities, never the host default by accident.
            Doctrine\ORM\EntityManagerInterface $entityManager: '@nowo_api_studio.entity_manager'

    Nowo\ApiStudioBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Model/'
            - '../../EventSubscriber/'
            - '../../Form/'
            - '../../Soap/'
            - '../../Secret/'
            - '../../ApiStudioBundle.php'
            - '../../Tenancy/TenantProviderResolver.php'
            # 1.14: built per import call (holds that import's folder index), never a shared service.
            - '../../Service/ImportExport/FolderImportHelper.php'
            # 1.15: server runner value objects (ScriptRunRequest, ScriptRunResult, ...).
            - '../../Script/Runner/Script*.php'
            - '../../Controller/'
            # 1.18 global search: registered by the extension only when search.enabled (and value objects).
            - '../../Search/'
            - '../../Bridge/'
            - '../../Event/ApiStudioSearchContextEvent.php'
            # 1.17 value objects and exceptions of the workspace scopes and the seed API.
            - '../../Scope/WorkspaceScope.php'
            - '../../Scope/ScopeRouteContext.php'
            - '../../Scope/ScopeAccessSubject.php'
            - '../../Scope/WorkspaceSlugTakenException.php'
            - '../../Seed/{EndpointSeed,EnvironmentSeed,SecretReferenceSeed,SeedStats,SeedValidation,ServiceSeed,VariableSeed,WorkspaceSeed,WorkspaceSeedResult}.php'
            # 1.19 value objects of the workspace query port.
            - '../../Query/{ApiWorkspaceCriteria,ApiWorkspacePage,ApiWorkspaceSort,ApiWorkspaceView}.php'
            # 1.20 row versions: the stale-edit exception and the static guard (the listener stays a service).
            - '../../Concurrency/'
            - '../../Doctrine/RowVersionGuard.php'
            - '../../Doctrine/DefaultEnvironmentSwitch.php'
            # 1.21.1 the static import unit (workspace lock first).
            - '../../Doctrine/WorkspaceImportUnit.php'

    # Controllers carry #[Route] attributes: autoconfigure stays off so Symfony >= 7.3 does not tag them
    # routing.controller (the host's `routing.controllers` resource would then load every Api Studio route without
    # importing routes.yaml, bypassing its prefix and when@ guards). Routes are opt-in through routes.yaml only.
    Nowo\ApiStudioBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\ApiStudioBundle\Repository\:
        resource: '../../Repository/'

    Nowo\ApiStudioBundle\Command\:
        resource: '../../Command/'
        tags: ['console.command']

    Nowo\ApiStudioBundle\Doctrine\ApiStudioEntityManagerResolver:
        arguments:
            $managerName: '%nowo_api_studio.entity_manager%'

    nowo_api_studio.entity_manager:
        class: Doctrine\ORM\EntityManagerInterface
        factory: ['@Nowo\ApiStudioBundle\Doctrine\ApiStudioEntityManagerResolver', 'entityManager']

    Nowo\ApiStudioBundle\Tenancy\TenantSqlFilterListener:
        arguments:
            $entityManager: '%nowo_api_studio.entity_manager%'

    Nowo\ApiStudioBundle\EventListener\EntityManagerRecoverySubscriber:
        arguments:
            $entityManager: '%nowo_api_studio.entity_manager%'

    # 1.12.1 (REQ-RUNTIME-002 rule 4): clears / recreates the bundle-owned manager at the request, Messenger and console
    # boundaries. ApiStudioEntityManagerPass sets $managers (an IGNORE_ON_UNINITIALIZED reference) only when
    # entity_manager names a manager other than the host's default one; otherwise it stays empty (host manager untouched).
    Nowo\ApiStudioBundle\EventListener\EntityManagerBoundarySubscriber:
        autowire: false
        arguments:
            $registries: !iterator ['@!doctrine']
            $managers: !iterator []
            $managerName: '%nowo_api_studio.entity_manager%'
            $requestStack: '@?request_stack'

    Nowo\ApiStudioBundle\Service\LocaleManager:
        arguments:
            $enabledLocales: '%nowo_api_studio.ui.locales%'
            $defaultLocale: '%nowo_api_studio.ui.default_locale%'

    Nowo\ApiStudioBundle\Routing\ApiStudioRouteLoader:
        arguments:
            $path: '%nowo_api_studio.ui.path%'
            $localesRequirement: '%nowo_api_studio.ui.locales_requirement%'
            $placeholders: '%nowo_api_studio.ui.path_placeholders%'
            $requirements: '%nowo_api_studio.ui.path_requirements%'
            $env: '%kernel.environment%'
            $scopedPath: '%nowo_api_studio.scope.path%'
            $scopedPlaceholders: '%nowo_api_studio.scope.path_placeholders%'
            $scopedRequirements: '%nowo_api_studio.scope.path_requirements%'
        tags: ['routing.loader']

    Nowo\ApiStudioBundle\Routing\ApiStudioRouteScopeListener:
        arguments:
            $router: '@router'
            $placeholders: '%nowo_api_studio.ui.path_placeholders%'
            $scopedPlaceholders: '%nowo_api_studio.scope.path_placeholders%'

    # 1.17: bundle links stay inside a scope.path mount ($scopedRoutes set by the extension).
    Nowo\ApiStudioBundle\Routing\ApiStudioUrlGenerator:
        public: true
        arguments:
            $router: '@router'
            $requestStack: '@?request_stack'
            $scopedRoutes: false

    # 1.17 workspace scopes ($enabled / $resolver set by the extension).
    Nowo\ApiStudioBundle\Scope\ScopeContext:
        arguments:
            $requestStack: '@?request_stack'
            $enabled: false

    Nowo\ApiStudioBundle\Scope\ScopeListener:
        arguments:
            $resolver: null
            $enabled: false

    # 1.19 (DDD-host checklist B1/B7/B8): host ports by ids. $scopeChecker is set by the extension (scope.enabled).
    Nowo\ApiStudioBundle\Query\ApiWorkspaceQueryInterface:
        alias: Nowo\ApiStudioBundle\Query\DoctrineApiWorkspaceQuery
        public: true

    Nowo\ApiStudioBundle\Security\ApiWorkspaceAccess:
        arguments:
            $scopeChecker: null
            $logger: '@?logger'

    Nowo\ApiStudioBundle\Security\ApiWorkspaceAccessInterface:
        alias: Nowo\ApiStudioBundle\Security\ApiWorkspaceAccess
        public: true

    Nowo\ApiStudioBundle\Seed\WorkspaceSeeder:
        public: true
        arguments:
            $managerName: '%nowo_api_studio.entity_manager%'
            $dispatcher: '@?event_dispatcher'
            $logger: '@?logger'

    Nowo\ApiStudioBundle\Scope\WorkspaceScopeMover:
        public: true
        arguments:
            $managerName: '%nowo_api_studio.entity_manager%'
            $dispatcher: '@?event_dispatcher'
            $logger: '@?logger'

    Nowo\ApiStudioBundle\EventListener\ConcurrencyConflictSubscriber:
        arguments:
            $logger: '@?logger'

    Nowo\ApiStudioBundle\EventListener\LocaleSubscriber:
        arguments:
            $scope: '%nowo_api_studio.ui.locale_scope%'

    Nowo\ApiStudioBundle\Service\WorkspaceEnvironmentInitializer:
        arguments:
            $defaultEnvironmentNames: '%nowo_api_studio.environments%'

    Nowo\ApiStudioBundle\Service\RequestExecutor:
        arguments:
            $timeoutSeconds: '%nowo_api_studio.ui.request_timeout_seconds%'
            $maxRedirects: '%nowo_api_studio.execution_max_redirects%'
            $maxResponseBytes: '%nowo_api_studio.execution_max_response_bytes%'

    Nowo\ApiStudioBundle\Controller\DashboardController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $listPageSize: '%nowo_api_studio.ui.list_page_size%'

    Nowo\ApiStudioBundle\Controller\ApiServiceController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'

    Nowo\ApiStudioBundle\Controller\ApiEndpointController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'
            $scriptLevels: '%nowo_api_studio.scripts.levels%'

    Nowo\ApiStudioBundle\Controller\ScriptSandboxController:
        autoconfigure: false
        tags: ['controller.service_arguments']
        arguments:
            $scriptsMode: '%nowo_api_studio.scripts.mode%'
            $packages: '@?assets.packages'

    Nowo\ApiStudioBundle\Controller\ScriptSendRequestController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $scriptsMode: '%nowo_api_studio.scripts.mode%'

    Nowo\ApiStudioBundle\Controller\ScriptVariablesController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $scriptsMode: '%nowo_api_studio.scripts.mode%'

    # 1.15 server runner: the sidecar gets pm.sendRequest through the same guarded sender.
    Nowo\ApiStudioBundle\Script\Runner\ProcessScriptRunner:
        arguments:
            $sender: '@Nowo\ApiStudioBundle\Script\ScriptRequestSender'

    Nowo\ApiStudioBundle\Script\Runner\ApiStudioScriptRunnerInterface:
        alias: Nowo\ApiStudioBundle\Script\Runner\NullScriptRunner
        public: true

    # 1.15: scripts of an endpoint in run order for runs outside the browser (server runner).
    Nowo\ApiStudioBundle\Script\ScriptChainBuilder:
        arguments:
            $scriptLevels: '%nowo_api_studio.scripts.levels%'

    # 1.15 pm.sendRequest: same guards and limits as the console executor.
    Nowo\ApiStudioBundle\Script\ScriptRequestSender:
        arguments:
            $timeoutSeconds: '%nowo_api_studio.ui.request_timeout_seconds%'
            $maxResponseBytes: '%nowo_api_studio.execution_max_response_bytes%'

    Nowo\ApiStudioBundle\Controller\ApiFolderController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'
            $scriptLevels: '%nowo_api_studio.scripts.levels%'

    Nowo\ApiStudioBundle\Controller\ApiWorkspaceController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $listPageSize: '%nowo_api_studio.ui.list_page_size%'
            $scriptLevels: '%nowo_api_studio.scripts.levels%'

    Nowo\ApiStudioBundle\Twig\ApiStudioExtension:
        arguments:
            $layoutTemplate: '%nowo_api_studio.ui.layout_template%'
            $cssFramework: '%nowo_api_studio.ui.css_framework%'
            $scriptsMode: '%nowo_api_studio.scripts.mode%'
            $scriptsConfirmStored: '%nowo_api_studio.scripts.confirm_stored%'
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'
            $scriptsTimeoutMs: '%nowo_api_studio.scripts.limits.time_ms%'
            $scriptsSendBudget: '%nowo_api_studio.scripts.limits.send_requests%'

    # UiKit page contract (REQ-UI-003): layout resolution (null = nowo_ui_kit.layouts.admin) + view models.
    Nowo\ApiStudioBundle\Ui\ApiStudioPages:
        arguments:
            $layoutTemplate: '%nowo_api_studio.ui.layout_template%'
            $twig: '@twig'
            $scopeLayoutTemplate: '%nowo_api_studio.scope.layout_template%'
            $headerActions: '%nowo_api_studio.ui.header_actions%'

    # 1.14 folders: depth limit; the folder checker is set by the extension (null without folders / checker).
    Nowo\ApiStudioBundle\Ui\ApiStudioPageFactory:
        arguments:
            $urlGenerator: '@Nowo\ApiStudioBundle\Routing\ApiStudioUrlGenerator'
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'
            $scopeLabels: null

    Nowo\ApiStudioBundle\Service\StudioNavigationProvider:
        arguments:
            $urlGenerator: '@Nowo\ApiStudioBundle\Routing\ApiStudioUrlGenerator'
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'

    # 1.14: the importers recreate folders (Postman item groups, OpenAPI tags / x-api-studio-folder) only with folders on.
    Nowo\ApiStudioBundle\Service\ImportExport\PostmanCollectionImporter:
        arguments:
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'
            $maxDepth: '%nowo_api_studio.folders.max_depth%'
            $scriptsImportable: '%nowo_api_studio.scripts.levels%'

    Nowo\ApiStudioBundle\Service\ImportExport\OpenApiImporter:
        arguments:
            $foldersEnabled: '%nowo_api_studio.folders.enabled%'
            $maxDepth: '%nowo_api_studio.folders.max_depth%'

    Nowo\ApiStudioBundle\Service\FolderTree:
        arguments:
            $maxDepth: '%nowo_api_studio.folders.max_depth%'

    Nowo\ApiStudioBundle\Security\FolderAccess:
        arguments:
            $checker: null

    Nowo\ApiStudioBundle\Doctrine\TablePrefixSubscriber:
        arguments:
            $tablePrefix: '%nowo_api_studio.table_prefix%'
            $tenancy: '%nowo_api_studio.tenancy.enabled%'

    Nowo\ApiStudioBundle\Security\SecretValueCipher:
        arguments:
            $encryptionKeyMaterial: '%nowo_api_studio.secrets.encryption_key_material%'

    Nowo\ApiStudioBundle\Doctrine\SecretVariableEncryptionListener:
        arguments:
            $cipher: '@Nowo\ApiStudioBundle\Security\SecretValueCipher'
            $enabled: '%nowo_api_studio.secrets.encrypt%'
            $logger: '@?logger'

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\ApiStudioBundle\Form\:
        resource: '../../Form/'
        exclude: ['../../Form/DataTransformer/', '../../Form/EventListener/']
        tags: ['form.type']
